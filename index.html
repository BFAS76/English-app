<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Master Pro</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">

    <!-- Mapeia bare specifiers npm para CDN — necessário para GitHub Pages -->
    <script type="importmap">
    {
        "imports": {
            "firebase/app":       "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js",
            "firebase/auth":      "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js"
        }
    }
    </script>

    <style>
        :root { --primary: #00f2fe; --bg: #0f172a; --card: #1e293b; --text-sec: #94a3b8; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg); color: white; margin: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
            overflow: hidden;
        }
        .container { width: 90%; max-width: 400px; background: var(--card); padding: 25px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .category { font-size: 0.7rem; color: var(--primary); text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
        #phrase-display { font-size: 1.4rem; font-weight: bold; margin: 15px 0 5px 0; color: #f8fafc; line-height: 1.3; }
        #translation-display { font-size: 1rem; color: var(--text-sec); font-style: italic; margin-bottom: 20px; min-height: 1.2em; }
        .controls { display: grid; gap: 12px; }
        button {
            border: none; padding: 18px; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            transition: 0.2s; -webkit-tap-highlight-color: transparent;
        }
        button:active { transform: scale(0.96); }
        .btn-listen { background: #334155; color: var(--primary); border: 1px solid var(--primary); }
        .btn-speak { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #0f172a; }
        .btn-next { background: transparent; color: var(--text-sec); text-decoration: underline; font-size: 0.85rem; margin-top: 5px; }
        #status { margin-top: 15px; font-size: 0.9rem; color: var(--text-sec); min-height: 3em; }
        .points-box { color: #4ade80; font-weight: bold; margin-bottom: 10px; }

        .selector-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
        .btn-lang, .btn-level {
            background: #334155; color: var(--text-sec);
            padding: 7px 14px; border-radius: 20px; font-size: 0.8rem;
            border: 1px solid transparent;
        }
        .btn-lang.active, .btn-level.active { color: var(--primary); border-color: var(--primary); }
        .auth-row { text-align: right; margin-bottom: 8px; }
        .btn-auth { background: transparent; color: var(--text-sec); font-size: 0.75rem; padding: 5px 10px; border-radius: 10px; border: 1px solid #334155; }
        .btn-auth:hover { border-color: var(--primary); color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <div class="auth-row">
        <button id="auth-btn" class="btn-auth" title="Login para sincronizar entre dispositivos">☁️ Sync</button>
    </div>
    <div class="selector-row">
        <button class="btn-lang active" data-lang="en">🇬🇧 EN</button>
        <button class="btn-lang" data-lang="de">🇩🇪 DE</button>
    </div>
    <div class="selector-row">
        <button class="btn-level active" data-level="A1">A1</button>
        <button class="btn-level" data-level="A2">A2</button>
        <button class="btn-level" data-level="B1">B1</button>
    </div>

    <div class="points-box">XP: <span id="points">0</span></div>
    <div id="cat-display" class="category">Tap to start</div>
    <div id="phrase-display">Ready?</div>
    <div id="translation-display">Clique para começar</div>

    <div class="controls">
        <button class="btn-listen">🔊 Hear Native</button>
        <button id="mic-btn" class="btn-speak">🎤 Speak Now</button>
        <button class="btn-next">Skip / Next ➔</button>
    </div>
    <div id="status">Tip: Click "Hear Native" to learn the sound first!</div>
</div>

<script type="module">
    import { initAudio, playVoice, startRecognition, nextPhrase, switchLanguage, switchLevel, loadFromCloud, cloud } from './app.js';
    import { initFirebase, onAuthChange, signIn, signOutUser, getCurrentUser, cloudSave, cloudLoad } from './firebase.js';

    // ----------------------------------------------------------------
    // Configuração Firebase — preenche com os teus valores
    // Deixa apiKey como 'YOUR_API_KEY' para correr sem Firebase
    // ----------------------------------------------------------------
    const FIREBASE_CONFIG = {
        apiKey:            'YOUR_API_KEY',
        authDomain:        'YOUR_PROJECT.firebaseapp.com',
        projectId:         'YOUR_PROJECT_ID',
        storageBucket:     'YOUR_PROJECT.appspot.com',
        messagingSenderId: 'YOUR_SENDER_ID',
        appId:             'YOUR_APP_ID',
    };

    initFirebase(FIREBASE_CONFIG);

    // Liga as funções cloud ao app.js (só após Firebase estar pronto)
    cloud.save = cloudSave;
    cloud.load = cloudLoad;

    onAuthChange(async (user) => {
        const btn = document.getElementById('auth-btn');
        if (user) {
            btn.textContent = `✓ ${user.displayName?.split(' ')[0] ?? 'Sync'}`;
            btn.title = `Sessão: ${user.email} — clica para sair`;
            await loadFromCloud();
        } else {
            btn.textContent = '☁️ Sync';
            btn.title = 'Login com Google para sincronizar entre dispositivos';
        }
    });

    document.getElementById('auth-btn').addEventListener('click', async () => {
        if (getCurrentUser()) {
            await signOutUser();
        } else {
            await signIn().catch(() => {});
        }
    });

    // Controlos da app
    document.body.addEventListener('click', initAudio);
    document.querySelector('.btn-listen').addEventListener('click', playVoice);
    document.getElementById('mic-btn').addEventListener('click', startRecognition);
    document.querySelector('.btn-next').addEventListener('click', nextPhrase);

    document.querySelectorAll('[data-lang]').forEach(btn => {
        btn.addEventListener('click', () => switchLanguage(btn.dataset.lang));
    });
    document.querySelectorAll('[data-level]').forEach(btn => {
        btn.addEventListener('click', () => switchLevel(btn.dataset.level));
    });
</script>
</body>
</html>
